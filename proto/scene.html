<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observation Deck — style test</title>
<style>
  :root{
    --ink:#0b0c10; --wall:#2a2d36; --wall-d:#1c1e25; --wall-l:#3a3e4a;
    --light:#a9c2ff; --light-s:#6f8fe0; --screen:#8fd0ff;
  }
  html,body{margin:0;height:100%;background:#07080c;overflow:hidden}
  #space,#room,#fore,#grain{position:fixed;inset:0;width:100%;height:100%}
  #room,#fore{pointer-events:none}
  #grain{pointer-events:none;mix-blend-mode:overlay;opacity:.12}
  .layer{will-change:transform;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
  .sway.b{animation-duration:9s;animation-delay:-3s}
  .sway.c{animation-duration:11s;animation-delay:-5s}
  @keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
  .flick{animation:flick 4s steps(1) infinite}
  .flick.b{animation-delay:-1.3s;animation-duration:5.5s}
  .flick.c{animation-delay:-2.1s;animation-duration:3.2s}
  @keyframes flick{0%,100%{opacity:1}47%{opacity:.82}48%{opacity:1}72%{opacity:.9}73%{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hair{transform-box:fill-box;transform-origin:30% 0;animation:hair 5s ease-in-out infinite alternate}
  @keyframes hair{from{transform:skewX(-2deg)}to{transform:skewX(3deg)}}
  .led{animation:blink 1.6s steps(1) infinite}.led.b{animation-duration:2.3s;animation-delay:-.7s}.led.c{animation-duration:.9s}
  .lampglow{animation:flick 6s steps(1) infinite}
  .persona-fo{pointer-events:auto;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- space through the hatch ----
const sc = document.getElementById('space'), sx = sc.getContext('2d');
let W, H, stars = [], t0 = performance.now();
function sizeSpace(){
  const d = Math.min(devicePixelRatio, 2);
  W = sc.width = innerWidth * d; H = sc.height = innerHeight * d;
  stars = Array.from({length: 420}, () => ({
    x: Math.random()*W, y: Math.random()*H*.85, r: Math.random()*1.6*d + .3,
    p: Math.random()*6.28, s: .4 + Math.random()*1.6
  }));
}
// planet sits in the hatch: map SVG coords (slice-fit) to screen
function svgToScreen(x, y){
  const s = Math.max(innerWidth/1600, innerHeight/900);
  const ox = (innerWidth - 1600*s)/2, oy = (innerHeight - 900*s)/2;
  const d = Math.min(devicePixelRatio, 2);
  return [(ox + x*s)*d, (oy + y*s)*d, s*d];
}
let ship = null;
function drawSpace(now){
  const t = (now - t0)/1000;
  const g = sx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05060c'); g.addColorStop(.6,'#0d1430'); g.addColorStop(1,'#1d2a5c');
  sx.fillStyle = g; sx.fillRect(0,0,W,H);
  // nebula wash
  const [nx, ny, s] = svgToScreen(760, 330);
  let n = sx.createRadialGradient(nx,ny,0,nx,ny,420*s);
  n.addColorStop(0,'rgba(120,150,255,.38)'); n.addColorStop(.5,'rgba(90,70,200,.16)'); n.addColorStop(1,'rgba(0,0,0,0)');
  sx.fillStyle = n; sx.fillRect(0,0,W,H);
  for (const st of stars){
    const a = .45 + .55*Math.sin(t*st.s + st.p);
    sx.globalAlpha = a; sx.fillStyle = '#dfe8ff';
    sx.fillRect(st.x, st.y, st.r, st.r);
  }
  sx.globalAlpha = 1;
  // big planet low in the hatch, slowly turning bands
  const [px, py] = svgToScreen(960, 760), pr = 300*s;
  sx.save(); sx.beginPath(); sx.arc(px,py,pr,0,7); sx.clip();
  const pg = sx.createRadialGradient(px-pr*.4,py-pr*.5,pr*.1,px,py,pr);
  pg.addColorStop(0,'#d9e4ff'); pg.addColorStop(.35,'#7f9be6'); pg.addColorStop(1,'#1b2350');
  sx.fillStyle = pg; sx.fillRect(px-pr,py-pr,pr*2,pr*2);
  sx.globalAlpha = .18; sx.strokeStyle = '#0b1030';
  for (let i=0;i<9;i++){
    sx.lineWidth = (6+i%3*5)*s;
    sx.beginPath(); sx.ellipse(px, py-pr*.7 + i*pr*.16, pr*1.2, pr*.1, -.12, 0, 7); sx.stroke();
  }
  sx.restore(); sx.globalAlpha = 1;
  // ink outline on the planet so it matches the room
  sx.lineWidth = 5*s; sx.strokeStyle = '#0b0c10';
  sx.beginPath(); sx.arc(px,py,pr,0,7); sx.stroke();
  // occasional ship crossing
  if (!ship && Math.random() < .002) ship = {x: svgToScreen(500,0)[0], y: svgToScreen(0, 260+Math.random()*120)[1]};
  if (ship){
    ship.x += 2.2*s;
    sx.fillStyle = '#0b0c10';
    sx.beginPath(); sx.moveTo(ship.x,ship.y); sx.lineTo(ship.x-34*s,ship.y-6*s); sx.lineTo(ship.x-46*s,ship.y-16*s);
    sx.lineTo(ship.x-40*s,ship.y); sx.lineTo(ship.x-46*s,ship.y+10*s); sx.closePath(); sx.fill();
    sx.fillStyle = 'rgba(169,194,255,.8)'; sx.fillRect(ship.x-52*s, ship.y-2*s, 6*s, 3*s);
    if (ship.x > svgToScreen(1150,0)[0]) ship = null;
  }
}
function loop(now){ drawSpace(now); grainTick(); if(!reduce) requestAnimationFrame(loop); }

// ---- film grain ----
const gc = document.getElementById('grain'), gx = gc.getContext('2d');
const tile = document.createElement('canvas'); tile.width = tile.height = 160;
{ const tx = tile.getContext('2d'), id = tx.createImageData(160,160);
  for (let i=0;i<id.data.length;i+=4){ const v = Math.random()*255; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
  tx.putImageData(id,0,0); }
let gf = 0;
function sizeGrain(){ gc.width = innerWidth; gc.height = innerHeight; }
function grainTick(){
  if ((gf++ % 3)) return;
  gx.fillStyle = gx.createPattern(tile,'repeat');
  gx.save(); gx.translate(Math.random()*160, Math.random()*160);
  gx.fillRect(-160,-160,gc.width+320,gc.height+320); gx.restore();
}

// ---- parallax on pointer ----
const layers = [...document.querySelectorAll('.layer')];
addEventListener('pointermove', e => {
  if (reduce) return;
  const dx = e.clientX/innerWidth - .5, dy = e.clientY/innerHeight - .5;
  for (const l of layers){ const d = +l.dataset.depth; l.style.transform = `translate(${-dx*d}px,${-dy*d*.5}px)`; }
});

function resize(){ sizeSpace(); sizeGrain(); drawSpace(performance.now()); grainTick(); }
addEventListener('resize', resize); resize();
requestAnimationFrame(loop);
</script>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.43.1/rive.js"></script>
<script>
// sized in device pixels for the slice-fitted SVG so the vector stays crisp
const pc = document.getElementById('persona');
function sizePersona(){
  const s = Math.max(innerWidth/1600, innerHeight/900) * Math.min(devicePixelRatio, 2);
  pc.width = Math.round(150*s); pc.height = Math.round(240*s);
}
sizePersona();
const persona = new rive.Rive({
  src: 'persona.riv', canvas: pc, stateMachines: 'Persona', autoplay: true, autoBind: true,
  onLoad: () => persona.resizeDrawingSurfaceToCanvas()
});
addEventListener('resize', () => { sizePersona(); persona.resizeDrawingSurfaceToCanvas(); });
</script>
